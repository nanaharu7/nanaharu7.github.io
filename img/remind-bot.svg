<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="担当者に届いたリマインドで「期限を調整したい」を押すと、進行管理の人にメンション付きで知らせが届く図">
  <style>
    text { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif; fill: #4f4640; }
    .en { font-family: "Outfit", "Segoe UI", "Helvetica Neue", sans-serif; }
    .muted { fill: #9b8f82; }
    .white { fill: #fff; }
    .bold { font-weight: 700; }
  </style>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#6b5644" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <!-- ボットのアイコン（ベル） -->
        <symbol id="bot" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="18" fill="#6b5644"/>
          <path d="M18 9.5c-3.6 0-6 2.7-6 6.2v4.1l-1.8 2.6h15.6L24 19.8v-4.1c0-3.5-2.4-6.2-6-6.2Z" fill="#fff"/>
          <circle cx="18" cy="25.5" r="2" fill="#fff"/>
        </symbol>
      </defs>

      <rect width="720" height="440" fill="#f4efe6"/>

      <!-- 担当者に届くDM（文面とボタンは remind-bot の実際の表記に合わせる） -->
      <text x="40" y="44" class="muted" font-size="13">担当者に届くDM</text>
      <rect x="24" y="60" width="392" height="352" rx="18" fill="#fff"/>
      <use href="#bot" x="48" y="80" width="36" height="36"/>
      <text x="96" y="96" class="en bold" font-size="15">remind-bot</text>
      <rect x="186" y="83" width="34" height="18" rx="5" fill="#cdbfa9"/>
      <text x="203" y="96" class="en bold" font-size="10" text-anchor="middle">BOT</text>
      <text x="96" y="124" font-size="13.5">🔔 #3「背景イラストの線画」の期限は</text>
      <text x="96" y="146" font-size="13.5">明日です。</text>
      <text x="96" y="172" font-size="13.5">いまの進み具合を、下のボタンで教えてください。</text>

      <rect x="96" y="190" width="104" height="38" rx="10" fill="#8f8a6b"/>
      <text x="148" y="214" class="white bold" font-size="13.5" text-anchor="middle">完了 ✅</text>
      <rect x="208" y="190" width="124" height="38" rx="10" fill="#6b5644"/>
      <text x="270" y="214" class="white bold" font-size="13.5" text-anchor="middle">いい調子 🌱</text>
      <rect x="96" y="236" width="150" height="38" rx="10" fill="#a88f74"/>
      <text x="171" y="260" class="white bold" font-size="13.5" text-anchor="middle">期限を調整したい</text>
      <rect x="254" y="236" width="150" height="38" rx="10" fill="#fff" stroke="#d8cfc2" stroke-width="1.5"/>
      <text x="329" y="260" font-size="13.5" text-anchor="middle">手を貸してほしい</text>
      <!-- 押しているカーソル -->
      <path d="M206 262v19l4.6-4.4 3.4 7.6 3.2-1.5-3.4-7.4h6.4Z" fill="#fff" stroke="#4f4640" stroke-width="1.6" stroke-linejoin="round"/>

      <!-- 押すと出る入力欄 -->
      <rect x="96" y="296" width="296" height="92" rx="12" fill="#f4efe6"/>
      <text x="114" y="324" class="muted" font-size="12">新しい見込み日</text>
      <text x="216" y="324" class="bold" font-size="14">11/10</text>
      <text x="114" y="350" class="muted" font-size="12">ひとこと</text>
      <text x="114" y="372" font-size="12.5">資料集めに時間がかかっています</text>

      <!-- 流れ -->
      <path d="M396 360 C 440 372, 500 366, 540 340" fill="none" stroke="#6b5644" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="470" y="398" class="muted" font-size="12" text-anchor="middle">進行管理の人に通知</text>

      <!-- タスクのチャンネルに投稿され、進行管理の人がメンションされる -->
      <text x="456" y="104" class="muted" font-size="13">チャンネルに投稿</text>
      <rect x="440" y="120" width="264" height="212" rx="18" fill="#fff"/>
      <use href="#bot" x="460" y="140" width="30" height="30"/>
      <text x="500" y="160" class="en bold" font-size="14">remind-bot</text>
      <rect x="456" y="184" width="232" height="132" rx="12" fill="#f1e8dc"/>
      <rect x="470" y="196" width="58" height="22" rx="6" fill="#e8dfd2"/>
      <text x="499" y="211" class="en bold" font-size="12" text-anchor="middle" fill="#6b5644" style="fill:#6b5644">@haru</text>
      <text x="470" y="240" font-size="12.5">@aoiさん：#3</text>
      <text x="470" y="260" font-size="12.5">「背景イラストの線画」</text>
      <text x="470" y="282" class="bold" font-size="12.5">期限を調整したい（11/8→11/10）</text>
      <text x="470" y="302" class="muted" font-size="12">「資料集めに時間がかかっています」</text>
    </svg>
