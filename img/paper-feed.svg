<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="毎週、複数の論文データベースから新着論文を集め、AIが関連度を判定して要約し、注目の論文をスマホで読めるノートにまとめる図">
  <style>
    text { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif; fill: #4f4640; }
    .en { font-family: "Outfit", "Segoe UI", "Helvetica Neue", sans-serif; }
    .muted { fill: #9b8f82; }
    .white { fill: #fff; }
    .bold { font-weight: 700; }
  </style>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M1 1 L8 5 L1 9" fill="none" stroke="#6b5644" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
        <!-- 論文のアイコン -->
        <symbol id="doc" viewBox="0 0 24 32">
          <path d="M0 0 h16 l8 8 v24 h-24 Z" fill="#cdbfa9"/>
          <path d="M16 0 v8 h8" fill="none" stroke="#fff" stroke-width="1.5"/>
          <path d="M5 15 h14 M5 20 h14 M5 25 h9" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </symbol>
      </defs>

      <rect width="720" height="440" fill="#f4efe6"/>

      <!-- 新着論文を集める -->
      <text x="40" y="44" class="muted" font-size="13">新着論文を集める</text>
      <rect x="24" y="60" width="236" height="236" rx="18" fill="#fff"/>
      <g>
        <rect x="40" y="78" width="204" height="58" rx="12" fill="#f4efe6"/>
        <use href="#doc" x="56" y="91" width="24" height="32"/>
        <text x="94" y="102" class="en bold" font-size="13">OpenAlex</text>
        <text x="94" y="122" class="muted" font-size="11">全分野の論文</text>

        <rect x="40" y="148" width="204" height="58" rx="12" fill="#f4efe6"/>
        <use href="#doc" x="56" y="161" width="24" height="32"/>
        <text x="94" y="172" class="en bold" font-size="13">arXiv</text>
        <text x="94" y="192" class="muted" font-size="11">プレプリント</text>

        <rect x="40" y="218" width="204" height="58" rx="12" fill="#f4efe6"/>
        <use href="#doc" x="56" y="231" width="24" height="32"/>
        <text x="94" y="242" class="en bold" font-size="13">Europe PMC</text>
        <text x="94" y="262" class="muted" font-size="11">PubMed・bioRxivなど</text>
      </g>

      <!-- 自動で動く -->
      <rect x="24" y="312" width="236" height="100" rx="18" fill="#fff"/>
      <rect x="52" y="340" width="44" height="44" rx="9" fill="#e3d6c4"/>
      <path d="M52 349 a9 9 0 0 1 9 -9 h26 a9 9 0 0 1 9 9 v5 h-44 Z" fill="#a88f74"/>
      <text x="74" y="377" class="bold" font-size="14" text-anchor="middle">月</text>
      <text x="112" y="354" font-size="12.5">毎週月曜に自動で実行</text>
      <text x="112" y="374" font-size="12.5">PCの起動はいらない</text>

      <!-- AIが選んで要約する -->
      <path d="M266 186 C 278 186, 282 190, 290 190" fill="none" stroke="#6b5644" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <circle cx="316" cy="190" r="20" fill="#6b5644"/>
      <text x="316" y="195" class="en bold white" font-size="13" text-anchor="middle">AI</text>
      <path d="M340 190 C 350 190, 354 190, 364 190" fill="none" stroke="#6b5644" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#arrow)"/>
      <text x="316" y="236" class="muted" font-size="12" text-anchor="middle">関連度を</text>
      <text x="316" y="252" class="muted" font-size="12" text-anchor="middle">判定して</text>
      <text x="316" y="268" class="muted" font-size="12" text-anchor="middle">要約</text>

      <!-- アプリ：週ごとのノート -->
      <rect x="372" y="24" width="220" height="392" rx="30" fill="#fff" stroke="#6b5644" stroke-width="2"/>
      <rect x="450" y="36" width="64" height="8" rx="4" fill="#e6ddd0"/>
      <text x="392" y="76" class="bold" font-size="15">第46週の新着</text>
      <text x="392" y="96" class="muted" font-size="11">48件から 注目2件</text>

      <!-- 注目の論文 1 -->
      <rect x="388" y="112" width="188" height="128" rx="12" fill="#f4efe6"/>
      <rect x="402" y="124" width="62" height="22" rx="7" fill="#6b5644"/>
      <text x="433" y="139" class="white bold" font-size="11" text-anchor="middle">関連度 5</text>
      <text x="402" y="168" class="bold" font-size="12.5">アプリの利用ログから</text>
      <text x="402" y="187" class="bold" font-size="12.5">見る習慣の定着</text>
      <rect x="402" y="200" width="160" height="6" rx="3" fill="#e3d6c4"/>
      <rect x="402" y="212" width="160" height="6" rx="3" fill="#e3d6c4"/>
      <rect x="402" y="224" width="104" height="6" rx="3" fill="#e3d6c4"/>

      <!-- 注目の論文 2 -->
      <rect x="388" y="252" width="188" height="128" rx="12" fill="#f4efe6"/>
      <rect x="402" y="264" width="62" height="22" rx="7" fill="#a88f74"/>
      <text x="433" y="279" class="white bold" font-size="11" text-anchor="middle">関連度 4</text>
      <text x="402" y="308" class="bold" font-size="12.5">好奇心が生む</text>
      <text x="402" y="327" class="bold" font-size="12.5">ゲームでの探索</text>
      <rect x="402" y="340" width="160" height="6" rx="3" fill="#e3d6c4"/>
      <rect x="402" y="352" width="160" height="6" rx="3" fill="#e3d6c4"/>
      <rect x="402" y="364" width="88" height="6" rx="3" fill="#e3d6c4"/>

      <!-- 要約がひと目で読める -->
      <text x="604" y="168" font-size="12.5">要約まで</text>
      <text x="604" y="188" font-size="12.5">ひと目で</text>
      <path d="M626 206 C 622 220, 600 226, 582 220" fill="none" stroke="#6b5644" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
