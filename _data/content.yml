# サイトに表示する文章をまとめたファイル。
# ここを書き換えて保存すると、1〜2分でサイトに反映されます。
#
# 書き方のきまり
# - 「項目名: 文章」の形で書く。コロン（:）の後ろには半角スペースを1つ入れる
# - 先頭が @ の文章や、途中に「: 」（半角コロンと空白）を含む文章は "" で囲む
# - 行頭の字下げ（半角スペース）はそろえる。タブは使わない
# - 「- 」で始まる行は、一覧のひとつ分

# ページ上部（ヒーロー）
hero:
  name_en: Nanase Haru
  name_ja: 七瀬 陽
  # キャッチコピー。1行ずつ書くと、その位置で改行される
  catch:
    - 「一緒にやる」を、
    - もっと気軽に。
  # 説明文。PCではこの区切りで改行し、スマホでは続けて表示する
  lead:
    - 人が集まる場の手間や気まずさを減らすツールを作ります。

# 作品。上から順に 01, 02, … と番号がつく
# - id: 半角英数字の識別名（他の作品と重ならないもの）
# - kind: 種類
# - status: 開発中などの補足（なければ行ごと消す）
# - summary: 一覧に出す短い説明
# - text: 詳細を開いたときの説明
# - stack: 使った技術
# - image / image_alt: 画像のファイルと、その説明（なければ行ごと消す）
# - detail_image / detail_image_alt: 詳細だけに出す画像と、その説明（なければ一覧と同じ画像を出す）
# - link: GitHubなどのリンク（なければ note に書いた文字を出す）
# - case: 詳細に出すケーススタディ（なければ行ごと消す）
#     problem: どんな困りごとがあったか
#     points: 工夫したこと。title（見出し）と text（説明）を1組ずつ
works:
  - id: remind-bot
    title: remind-bot
    kind: Discord Bot
    summary: 遅れそうなタスクを、気軽に相談できるDiscordボット
    text: タスクの進み具合を、担当者がボタンひとつで伝えられるDiscordボット。期限が近づくと担当者にDMが届き、遅れそうなときは期限の調整や手助けを気軽に相談できます。進行管理の人は、チーム全体の状況を早めに把握できます。
    stack: TypeScript / Cloudflare Workers / D1
    image: img/remind-bot.svg
    image_alt: 担当者に届いたリマインドで「期限を調整したい」を押すと、進行管理の人にメンション付きで知らせが届く図
    detail_image: img/remind-bot-ad.png
    detail_image_alt: 「忘れないための通知から、助け合うための通知へ。」という見出しと、担当者に届くDMの見本
    link: https://github.com/nanaharu7/remind-bot
    case:
      problem: チームで作品を作っていると、遅れているタスクほど言い出しにくく、そのままうやむやになってしまうことがありました。担当者が負担なく言い出せることを、いちばんの目標にしました。
      points:
        - title: 責めない言葉にする
          text: ボタンは「遅れています」ではなく、「期限を調整したい」「手を貸してほしい」にしました。遅れを謝る言葉ではなく、次にどうするかを相談する言葉にしています。
        - title: 押すだけで報告が終わる
          text: ボタンを1つ押せば報告が終わります。理由やひとことは書かなくても送れるので、言葉を考えずにすぐ返せます。
        - title: 必要な通知を、必要な人へ
          text: ふだんの報告は通知を出さずにチャンネルへ流し、期限の調整は進行管理の人に、手助けの依頼は全員に知らせます。通知が多すぎると、大事な知らせが埋もれてしまうためです。

  - id: colonote
    title: Colonote
    kind: Web App
    summary: 誰が書いても同じ形になる、飼育記録のWebアプリ
    text: マウスの飼育ケージの記録を、ブラウザから管理するWebアプリ。サーバーや追加の費用はいらず、データは自分たちのGoogleドライブに置かれます。交配から離乳までの記録、操作の取り消し、共用PCでの記入者の切り替えに対応しています。
    stack: Google Apps Script
    image: img/colonote.png
    image_alt: Colonoteのケージ一覧。系統ごとに、ケージの運用区分・状態と♂♀・仔の匹数や週齢が並ぶ画面
    detail_image: img/colonote-ad.png
    detail_image_alt: 「いつものブラウザから、自分たちのファイルへ。」という見出しと、記録した直後に「取り消す」ボタンが出るケージ一覧の画面
    link: https://github.com/nanaharu7/animal-colony-manager
    case:
      problem: 飼育の作業は複数人で行う一方、記録はひとりがまとめていました。作業した人がメールや口頭で報告し、それを記録の担当が書き写す流れで、報告の形も人によってばらばらでした。作業した人がその場で、決まった形で記録できることを目標にしました。飼育室には物を持ち込めないため、もともとある端末のブラウザから使えるようにしています。
      points:
        - title: 誰が入力しても同じ形になる
          text: 自由に書くのではなく、項目を選んで埋める形にしました。ケージの登録から交配・出産・離乳まで、決まった手順で記録します。
        - title: 後から正しく見返せる
          text: 誰が・いつ・何を・どう変えたかを、変更前後の内容つきで残します。共用のPCでも記入者を選んでから操作するので、誰の記録かがあいまいになりません。
        - title: 迷わないボタンの並び
          text: ケージの状態に合わせて、そのとき使える操作のボタンだけを出します。交配・出産・離乳と、実際の作業の順番どおりに進められます。
        - title: 安心して触れる
          text: 操作した直後にその場で取り消せるので、記録に慣れていない人でも、ためらわずに入力できます。後から戻しても、交配から離乳までの記録のつじつまが崩れないよう設計しています。

  - id: anchorview
    title: AnchorView
    kind: VR Tool
    summary: VRChatで、それぞれの画面を同じ場所に映して一緒に観るツール
    text: ブラウザで再生している映像を、VRChatのワールドの決まった場所に映すツール。参加者がそれぞれ自分の画面を同じ場所に映すことで、みんなで一緒に観られます。
    stack: C# / OpenVR / UdonSharp
    image: img/anchorview.svg
    image_alt: 3人がそれぞれのブラウザで再生している映像が、ワールドの同じスクリーンに表示されている図
    note: Demo coming soon

  - id: sodefuri
    title: sodefuri
    kind: iOS App
    status: In development
    summary: すれ違った人と、おすすめの本を交換する
    text: すれ違った人と、おすすめの本を交換するアプリ。細かい位置情報を使わずに「近くにいた人」を判定し、サーバー費用をほとんどかけずに動かせます。
    stack: Flutter / Cloudflare Workers
    note: In development

  - id: shiori
    title: shiori
    kind: iOS App
    status: In development
    summary: 旅程をタイムラインで見て、地図や乗換案内をすぐ開ける
    text: 旅程をタイムラインで見て、地図や乗換案内をすぐ開けるアプリ。公開しているプロンプトでAIに旅程を作ってもらえば、そのままアプリに読み込めます。データは端末とiCloudにだけ保存されます。
    stack: Swift / iCloud
    note: In development

